[package]
name = "apresentation"
version = "0.1.0"
edition = "2024"

[dependencies]
proc_macros = { path = "./proc_macros" }

wgpu = "24.0.1"
winit = { version = "0.30", features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["rayon", "bmp", "gif", "ico", "jpeg", "png", "tga", "tiff", "webp"] }
ab_glyph = "0.2"
ttf-parser = "0.25"

parking_lot = "0.12"
pollster = "*"

anyhow = "1.0"
thiserror = "2.0"

downcast-rs = "2.0"
hashbrown = "0.15"
bytemuck = "1.22"
encase = "0.10"

impl-trait-for-tuples = "0.2"

rand = "0.9"
nalgebra = "0.33"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi"], optional = true }
tracing-tracy = { version = "0.11", optional = true }
clap = { version = "4.5", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
markdown-it = "0.6"

rhai = { version = "1.21", features = [ "internals", "no_time", "metadata" ] }

[features]
default = ["tracing-terminal"]
tracing-terminal = ["dep:tracing-subscriber"]
tracing-tracy = ["dep:tracing-tracy", "tracing-tracy/enable"]