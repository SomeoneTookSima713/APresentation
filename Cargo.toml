[package]
name = "apresentation"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0.1"
winit = { version = "0.30", features = ["rwh_06"] }

parking_lot = "0.12"
pollster = "*"

anyhow = "1.0"
thiserror = "2.0"

downcast-rs = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi"] }

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ron = "0.8"

rhai = { version = "1.21", features = [ "internals" ] }