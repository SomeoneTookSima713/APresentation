[package]
name = "apresentation"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0.1"
winit = { version = "0.30", features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["rayon", "bmp", "gif", "ico", "jpeg", "png", "tga", "tiff", "webp"] }

parking_lot = "0.12"
pollster = "*"

anyhow = "1.0"
thiserror = "2.0"

downcast-rs = "2.0"
hashbrown = "0.15"
bytemuck = "1.21"

impl-trait-for-tuples = "0.2"

rand = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi"] }
clap = { version = "4.5", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

rhai = { version = "1.21", features = [ "internals", "no_time" ] }